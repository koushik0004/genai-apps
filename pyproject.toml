[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-apps"
version = "0.1.0"
description = "Small GenAI applications organized by chapters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "ipython>=8.18.1",
    "streamlit>=1.50.0",
]
