[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genai-apps"
version = "0.1.0"
description = "Small GenAI applications organized by chapters"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "ipython>=8.18.1",
    "streamlit>=1.50.0",
    "pypdf>=6.20.0",
    "langchain-core>=0.3.86",
    "langchain-text-splitters>=0.3.11",
    "langchain-openai>=0.3.35",
    "langchain-qdrant>=0.2.1",
]
