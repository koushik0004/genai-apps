services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API & Built-in Web UI
      - "6334:6334" # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334

  neo4j:
    image: neo4j:latest
    container_name: local_neo4j
    restart: always
    ports:
      - "7474:7474" # Web Browser UI Port
      - "7687:7687" # Bolt Protocol (Python connection port)
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/logs:/logs
    environment:
      # Disables initial password requirement for local dev
      NEO4J_AUTH: "none"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]' # Essential plugins for AI/ML
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
